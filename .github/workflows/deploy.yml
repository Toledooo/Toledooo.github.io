name: Publicar portfólio

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # toda segunda, 06:17 UTC (03:17 em Brasília)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Testes
        run: python -m pytest -q

      # Se a API do GitHub falhar, este passo falha e o deploy não roda:
      # o site publicado continua como estava.
      - name: Gerar o site
        run: python -m generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTFOLIO_USER: Toledooo
          SITE_URL: https://toledooo.github.io
          CONTACT_URL: ${{ vars.CONTACT_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
